<circle cx="591.33" cy="319.77" r="5" fill="#2563eb"/>
<text class="value" x="591.33" y="308.77" text-anchor="middle">2.87</text>
<circle cx="822.00" cy="288.28" r="5" fill="#2563eb"/>
