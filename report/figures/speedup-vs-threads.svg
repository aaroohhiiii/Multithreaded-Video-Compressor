<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Encoder speedup by thread count</title>
<desc id="desc">Three 1280x720 YUV420 frames; five timed runs per point</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#536078}
.axis{font-size:12px}.axis-title{font-size:14px;font-weight:600}
.value{font-size:12px;font-weight:600}.legend{font-size:13px}
.grid{stroke:#dbe1ea;stroke-width:1}.frame{fill:#fff;stroke:#aeb8c7;stroke-width:1}
</style>
<rect width="900" height="520" fill="#ffffff"/>
<text class="title" x="88" y="34">Encoder speedup by thread count</text>
<text class="subtitle" x="88" y="55">Three 1280x720 YUV420 frames; five timed runs per point</text>
<rect class="frame" x="88" y="72" width="776" height="372"/>
