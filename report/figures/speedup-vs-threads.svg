<line class="grid" x1="822.00" y1="72" x2="822.00" y2="444"/>
<text class="axis" x="822.00" y="468" text-anchor="middle">8</text>
<text class="axis-title" x="476.00" y="500" text-anchor="middle">Worker threads</text>
<polyline points="130.00,400.74 360.67,355.54 591.33,319.77 822.00,288.28" fill="none" stroke="#2563eb" stroke-width="3"/>
