<line class="grid" x1="88" y1="146.40" x2="864" y2="146.40"/>
<text class="axis" x="78" y="150.40" text-anchor="end">6.9</text>
<line class="grid" x1="88" y1="72.00" x2="864" y2="72.00"/>
<text class="axis" x="78" y="76.00" text-anchor="end">8.6</text>
<text class="axis-title" x="22" y="258.00" text-anchor="middle" transform="rotate(-90 22 258.00)">Speedup relative to one thread (×)</text>
<line class="grid" x1="130.00" y1="72" x2="130.00" y2="444"/>
